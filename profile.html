<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div class="profile-heading">
        <h1 id="profile-heading-text" class="text-2xl sm:text-4xl font-extrabold tracking-tight">Insert name here's Profile</h1>

        <input type="text" id="display-name-input" class="input input-bordered font-extrabold text-2xl sm:text-4xl profile-heading-input" placeholder="Insert name here" maxlength="40" hidden>

        <button type="button" id="edit-name-button" class="btn btn-ghost btn-circle btn-sm" aria-label="Edit display name">
          <svg id="edit-name-icon" class="icon h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
          </svg>
          <svg id="save-name-icon" class="icon h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </button>
      </div>

      <div class="header-actions">
        <a href="index.html" class="btn btn-ghost btn-circle" aria-label="Back to exercises">
          <svg class="icon h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </a>

        <label class="swap swap-rotate theme-toggle" aria-label="Toggle day/night theme">
          <input type="checkbox" id="theme-toggle-input">

          <svg class="swap-off h-8 w-8 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
          </svg>

          <svg class="swap-on h-8 w-8 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
          </svg>
        </label>
      </div>
    </div>

    <div class="block">
      <h3 class="font-bold mt-4 mb-1">Achievements</h3>
      <div id="achievements-grid" class="achievements-grid"></div>
    </div>

    <div class="block">
      <h3 class="font-bold mt-4 mb-1">Progress</h3>
      <div id="progress-summary" class="mb-2"></div>
      <div class="tabs tabs-boxed w-fit">
        <button type="button" class="tab progress-tab-button" data-status="completed">Completed</button>
        <button type="button" class="tab progress-tab-button" data-status="attempted">Attempted</button>
        <button type="button" class="tab progress-tab-button" data-status="untouched">Not started</button>
      </div>
      <ul id="progress-list" class="progress-list"></ul>
    </div>

    <div class="block">
      <details id="sync-details">
        <summary>
          <svg class="icon summary-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
          Sync across browsers
        </summary>

        <div class="sync-panel">
          <p class="text-sm mb-2" style="color: var(--color-text-muted);">Copy your progress to paste into another browser, or paste progress copied from elsewhere to bring it here.</p>

          <div class="flex flex-wrap items-center gap-2">
            <button type="button" id="export-button" class="btn btn-outline btn-circle btn-sm" aria-label="Copy my progress" title="Copy my progress">
              <svg class="icon h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>

            <button type="button" id="import-toggle-button" class="btn btn-outline btn-circle btn-sm" aria-label="Import progress" title="Import progress">
              <svg class="icon h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12"/>
                <path d="m7 10 5 5 5-5"/>
                <path d="M5 21h14"/>
              </svg>
            </button>

            <span id="sync-status" class="text-sm" style="color: var(--color-text-muted);"></span>
          </div>

          <div id="import-panel" class="mt-2" hidden>
            <textarea id="sync-textarea" class="textarea textarea-bordered w-full font-mono text-xs" rows="4" placeholder="Paste your copied progress here…"></textarea>
            <button type="button" id="import-confirm-button" class="btn btn-primary btn-sm mt-2">Import</button>
          </div>
        </div>
      </details>
    </div>
  </div>

  <script src="progress.js" type="text/javascript"></script>
  <script src="exercise-data.js" type="text/javascript"></script>
  <script src="profile.js" type="text/javascript"></script>

  <script>
    (function () {
      var input = document.getElementById('theme-toggle-input');
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      input.checked = isDark;

      input.addEventListener('change', function () {
        var theme = input.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      });
    })();
  </script>
</body>
</html>
